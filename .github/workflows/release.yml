name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m ruff check app tests ../scripts/ci-smoke.py
          python -m mypy app ../scripts/ci-smoke.py --ignore-missing-imports
          python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=65
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

  build-release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Define lowercase image names
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/civicpulse-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/civicpulse-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Calculate backend release tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Calculate frontend release tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.frontend }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and publish backend release
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish frontend release
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Generate backend release SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          output-file: backend.spdx.json
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate frontend release SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
          output-file: frontend.spdx.json
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-sboms
          path: "*.spdx.json"
          if-no-files-found: error

  github-release:
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-sboms
          path: release-sboms
      - name: Publish generated release notes and SBOMs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-sboms/*.spdx.json
