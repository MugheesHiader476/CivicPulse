apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: civicpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: civicpulse
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: civicpulse-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://civicpulse:$(POSTGRES_PASSWORD)@postgres:5432/civicpulse
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: CLERK_SECRET_KEY
            - name: CLERK_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: CLERK_JWT_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: GROQ_API_KEY
          envFrom:
            - configMapRef:
                name: civicpulse-config
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # Initial guess was cpu 200m / memory 256Mi. Updated to the VPA target captured under load
          # (docs/evidence/vpa-recommendations.txt); VPA stays in Off mode so HPA owns scaling.
          resources:
            requests:
              cpu: 977m
              memory: 250Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
