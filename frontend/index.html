<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="CivicPulse - report a civic problem in your own words. AI triage sorts it by category and urgency so the burst main never waits behind a streetlight."
    />
    <meta name="theme-color" content="#ff3d7f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CivicPulse</title>
    <!-- Applies the saved light/dark preference before first paint (external file: the CSP forbids inline scripts). -->
    <script src="/theme-init.js"></script>
    <!-- Runtime configuration. Generated by nginx at container start from environment variables,
         so the same image runs in every environment. Never put secrets here: it is public. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CivicPulse needs JavaScript to run. Please enable it and reload.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
